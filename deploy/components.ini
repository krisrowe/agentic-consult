# Deployable components for agentic-consult.
# Used by: ./cloud deploy, ./cloud images list|build|push, ./cloud status
#
# INI format chosen over YAML for zero-install compatibility.
# ./cloud uses stdlib only - configparser is stdlib, PyYAML is not.

[mcp]
image = consult-mcp
target = mcp-http
terraform = google_cloud_run_v2_service.mcp_service

[fetcher]
image = gmex-fetcher
repo = https://github.com/krisrowe/gmail-extractor
ref = master
terraform = google_cloud_run_v2_job.fetcher_job

[config]
terraform = google_storage_bucket_object.app_resource
