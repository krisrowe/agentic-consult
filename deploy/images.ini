# Container image definitions for deployment.
# Used by: ./cloud images list|build|push, ./cloud status
#
# INI format chosen over YAML for zero-install compatibility.
# ./cloud uses stdlib only - configparser is stdlib, PyYAML is not.

[analyzer]
gcr_name = consult-analyzer
target = analyzer
internal = true

[mcp]
gcr_name = consult-mcp
target = mcp
internal = true

[fetcher]
gcr_name = gmex-fetcher
internal = false
repo = ~/ws/gmail-extractor
build_cmd = make build
push_cmd = make push
