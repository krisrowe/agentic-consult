gemini:
  debug: false
  models:
    default: gemini-2.5-flash
    # 3.x models commented out as not yet supported by google-genai SDK as of 12/25/2025
    # per https://docs.cloud.google.com/vertex-ai/generative-ai/docs/sdks/overview
    available:
      # - gemini-3-flash
      - gemini-2.5-flash
      - gemini-2.5-pro
      # - gemini-3-pro

email:
  read_archived_email: false
  max_emails: 50
  # Email content batching limits (in characters)
  max_prompt_content_chars: 100000  # Stop adding emails after this limit is reached/exceeded
  max_email_chars: 100000           # Truncate individual emails exceeding this limit

# Analyze Tool Configuration
analyze:
  max_file_count: 50
  max_total_content_bytes: 1048576  # 1MB

# Global Settings
use_mock_gemini: false

# Task Management Configuration
tasks:
  provider: ticktick
  cloud_sync: true
  default_project: Work

# Pre-commit Scanner Configuration
precommit:
  allowed_emails:
    - boss@gemini-test.com
    - pm@gemini-test.com
    - test@testcorp.com
    - test@fake.com
    - test@example.com
