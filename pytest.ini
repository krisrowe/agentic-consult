[pytest]
addopts = -v
markers =
    slow: tests requiring public network (terraform registry, pip, etc.)
    integration: tests requiring user auth/config/infrastructure
testpaths = tests/unit tests/slow
filterwarnings =
    # Suppress upstream DeprecationWarning from httplib2 (via google-api-python-client)
    # This is present in the latest SDKs as of Dec 26, 2025.
    ignore::DeprecationWarning:httplib2.auth
