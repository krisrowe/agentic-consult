# Personal Bundle - Opt-in rules for personal email management
#
# Import in email.yaml:
#   imports:
#     - source: personal
#       rules: ["*"]  # or specific patterns like ["marketing-*"]
#
# Source resolution hierarchy (future):
#   1. Bundle name → package (e.g., "personal" → this file)
#   2. Relative path → config dir (e.g., "./work.yaml")
#   3. Absolute path → as-is (e.g., "~/shared/team.yaml")

rules:
  - id: home-marketing-promo
    action: archive
    condition: >
      Email is clearly promotional/marketing: sales, discounts, coupons,
      "limited time offer", newsletters with no actionable content

  - id: home-social-notification
    action: archive
    condition: >
      Email is a social media notification (likes, comments, follows, friend requests)
      with no actionable content beyond "click to view"

  - id: home-shipping-delivered
    action: archive
    condition: >
      Email confirms a package was delivered successfully with no issues reported

  - id: home-routine-confirmation
    action: archive
    condition: >
      Email is a routine confirmation of a user-initiated action (subscription confirmed,
      settings updated, preferences saved) with no issues or action needed

  - id: home-school-student
    action: review
    condition: >
      Email from a school, teacher, or school administrator about a specific issue
      involving the recipient's child: discipline incident, health concern, injury,
      behavioral issue, absence, tardiness, grades dropping, missing assignments,
      or anything requiring individual parent attention or response

  - id: home-school-general
    action: archive
    condition: >
      Email from a school that is general communication to all parents:
      newsletters, weekly updates, curriculum info, upcoming tests, study guides,
      school events, lunch menus, PTA announcements, fundraiser info, or broadcast
      updates not about a specific child or requiring payment/signature/action

# DEFAULT STATE: DISABLED
# To enable these rules, add "home-*" to the 'enable' list in your 
# user configuration file (e.g. config://email.yaml).
disable:
  - "home-*"