# System Rules - Always applied
#
# These are universal safety-net rules that apply regardless of user config.
# They catch urgent issues that should never be auto-archived.

rules:
  - id: sys-important-direct
    action: review
    condition: >
      Email is from a known Customer domain or VIP list AND is addressed directly to the user
      (To/Cc line or mentions name/nickname in body), unless it is an automated notification.

  - id: sys-past-due-penalty
    action: track_as_task
    condition: >
      Email indicates something is past due, overdue, or penalties are/would be
      assessed or imposed (e.g., late fees, fines, interest charges, disconnection
      of service, account suspension, collection action, or similar consequences)

  - id: sys-payment-failed
    action: track_as_task
    condition: >
      Email indicates a payment failed, was declined, bounced, or could not be processed

  - id: sys-action-required
    action: review
    condition: >
      Email explicitly states "action required", "response needed", "please confirm",
      or similar urgent call to action that is not marketing/promotional

  - id: sys-security-alert
    action: review
    condition: >
      Email is a security alert about suspicious activity, unauthorized access,
      password reset request not initiated by user, new device login, or similar

  - id: sys-new-account-opened
    action: review
    condition: >
      Email indicates a new financial account, credit card, or loan was opened
      in the recipient's name
