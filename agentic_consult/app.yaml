gemini:
  debug: false
  models:
    # CRITICAL: NEVER LIST ANY MODEL VERSIONS BELOW 2.5
    default: gemini-2.5-flash
    available:
      - gemini-3.0-pro-preview
      - gemini-3.0-flash-preview
      - gemini-2.5-pro
      - gemini-2.5-flash
      - gemini-2.5-flash-lite

email:
  read_archived_email: false
  max_emails: 50
  # Email content batching limits (in characters)
  max_prompt_content_chars: 100000  # Stop adding emails after this limit is reached/exceeded
  max_email_chars: 100000           # Truncate individual emails exceeding this limit
  # Archive logging - tracks rule usage for identifying stale rules
  archive_log_retention_days: 90    # How long to keep archive logs
  # Review label for emails needing human attention
  review_label: Reviewing           # Gmail label applied by mark_email_in_review
  # Archivable label for emails pending age-based archive
  archivable_label: Archivable      # Gmail label for archive_later emails
  # Cache settings for email processing
  cache:
    email_max_age_days: 30          # Emails older than this + 1 week cache age get cleaned
    cleanup_file_age_days: 7        # Files must be this old before cleanup considers them
  # Triage table width configuration (total characters)
  triage_table_widths:
    small: 80
    medium: 120
    large: 160

# Analyze Tool Configuration
analyze:
  max_file_count: 50
  max_total_content_bytes: 1048576  # 1MB

# Global Settings
use_mock_gemini: false

# Task Management Configuration
tasks:
  provider: ticktick
  cloud_sync: true
  default_project: Work

# Pre-commit Scanner Configuration
precommit:
  # Focus only on unpushed/recent work (avoids blocking on old history)
  fresh_threshold_days: 3
  # Limit for strict history scanning
  strict_history_limit: 10
  allowed_emails:
    # --- BEST / UNIVERSAL EXAMPLES (Keep at top) ---
    - user@example.com
    - test@example.com
    - git@github.com
    
    # --- ACCEPTABLE ALTERNATIVES ---
    - sender@example.com
    - newsletter@example.com
    - test@testcorp.com
    - test@fake.com
    - bank@example.com
    
    # --- LEGACY / SPECIFIC WHITELIST (New additions go above here) ---
    - boss@gemini-test.com
    - pm@gemini-test.com

# Workspace Analysis Configuration
workspace_analysis:
  required_last_commits_match: 10
  required_total_match_percent: 90
  github_visibility_cache_duration: 2h

# Chat Triage Configuration
chat:
  triage:
    # Default number of spaces to scan
    limit: 10
    
    # Global limit on total messages scanned across all spaces
    message_limit: 100

    # Disable chat scanning for accounts matching this regex (e.g., personal Gmail)
    disabled_email_pattern: ".+@gmail\\.com"

    # Any space with <= this members is treated as a "Direct Message" context
    # where all unread messages are considered "mentions"
    implicit_mention_threshold: 3
    
    # Scanning Tiers: How far back to check based on space size
    tiers:
      - max_members: 2
        lookback_days: 14  # DMs: Check 2 weeks
      - max_members: 10
        lookback_days: 5   # Small Groups: Check 5 days
      - max_members: 50
        lookback_days: 2   # Medium Groups: Check 2 days
      - max_members: null  # Everything else (Large)
        lookback_days: 1   # Large Rooms: Check 1 day (or 0 to skip)
